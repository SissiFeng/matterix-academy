[project]
name = "matterix-academy"
version = "0.1.0"
description = "Laboratory training workspace with AWS deployment and a Matterix integration contract"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "mangum>=0.19,<1",
  "boto3>=1.38,<2", "itsdangerous>=2.2,<3", "httpx>=0.28,<1",
]

[project.optional-dependencies]
native-worker = ["aiortc==1.14.0", "aioice==0.10.2", "websockets>=15,<17", "numpy>=2,<3"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "moto[dynamodb]>=5,<6"]

[tool.pytest.ini_options]
pythonpath = ["app/backend"]
testpaths = ["app/backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Vendored byte copy of the canonical contracts; linted in its own repository.
extend-exclude = ["app/backend/labtwin"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app/backend/academy", "app/backend/labtwin"]
