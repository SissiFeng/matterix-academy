name: Verify academy
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          enable-cache: true
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.5.7'
      - run: uv sync --frozen
      - run: npm --prefix app/frontend ci --include=optional
      - run: bash scripts/build-lambda.sh
      - run: bash scripts/verify.sh
      - name: Install Chromium for browser journeys
        run: bash scripts/install-browser-ci.sh
      - run: npm run test:e2e
        working-directory: app/frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: browser-test-results
          path: |
            app/frontend/test-results
            build/browser-install-logs
          retention-days: 7
